# yaml-language-server: $schema=./node_modules/envio/evm.schema.json
name: envio-indexer
networks:
- id: 11155111
  start_block: 0
  contracts:
  - name: LiquidityHub
    address:
    - 0x9Bb4F457694B4ce51f765795677f6A5eEaB6fC9E
    handler: src/EventHandlers.ts
    events:
    - event: RebalanceStarted(uint256 deployedAssets);
    - event: RebalanceFinished(uint256 deployedAssets)
    - event: Issue(address indexed issuer, address indexed recipient, uint256 underlyingAmount, uint256 assetAmount)
    - event: InstantRedeem(address indexed redeemer, address indexed recipient, uint256 assetAmount, uint256 underlyingAmount)
    - event: RedeemRequest(uint256 requestId, address indexed redeemer, address indexed recipient, uint256 assetAmount)
    - event: Redeem(uint256 requestId, address indexed recipient, uint256 underlyingAmount)
  - name: sqUSD
    address:
    - 0xD7e84F7f7E2D5753D5727CDd367a97B66377618A
    handler: src/EventHandlers.ts
    events:
    - event: Transfer(address indexed from, address indexed to, uint256 amount)
    - event: Deposit(address indexed sender, address indexed owner, uint256 assets, uint256 shares)
    - event: Withdraw(address indexed sender, address indexed receiver, address indexed owner, uint256 assets,uint256 shares)
  - name: Router
    address:
    - 0x21A5e0a9Cd0d67970Da0639537C7f10119d2aD42
    handler: src/EventHandlers.ts
    events:
    - event: Deposit(address user, bool staked)
    - event: Withdraw(address user, bool unstaked, bool instant)

field_selection:
  transaction_fields:
    - transactionIndex
    - hash
unordered_multichain_mode: true
preload_handlers: true