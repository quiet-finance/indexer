# yaml-language-server: $schema=./node_modules/envio/evm.schema.json
name: quiet-finance-testnet
chains:
- id: 11155111
  start_block: 1
  contracts:
  - name: LiquidityHub
    address:
    - 0x0291984a993A15dCb3dDADcE8E4B7eD83E375867
    handler: src/EventHandlers.ts
    events:
    - event: RebalanceStarted(uint256 deployedUnderlying)
    - event: RebalanceFinished(uint256 deployedUnderlying)
    - event: RedeemsProcessed(uint256 lastProcessedRedeemId)
    - event: Issue(address indexed issuer, address indexed recipient, uint256 underlyingAmount, uint256 assetAmount)
    - event: InstantRedeem(address indexed redeemer, address indexed recipient, uint256 assetAmount, uint256 underlyingAmount)
    - event: RedeemRequest(uint256 redeemId, address indexed redeemer, address indexed recipient, uint256 assetAmount)
    - event: RedeemClaim(uint256 redeemId, address indexed recipient, uint256 underlyingAmount)
  - name: USDC
    address:
    - 0xf55B2Ab657147E94B228A2575483Ea3C73C88275
    handler: src/EventHandlers.ts
    events:
    - event: Transfer(address indexed from, address indexed to, uint256 amount)
  - name: QUSD
    address:
    - 0xfF04a50C7a768eBb465f0FC2B69e9C0c98272De7
    handler: src/EventHandlers.ts
    events:
    - event: Transfer(address indexed from, address indexed to, uint256 amount)
  - name: SQUSD
    address:
    - 0x0A80BdC3aAE72678B71f38EAc7e447ECd4b5c6cc
    handler: src/EventHandlers.ts
    events:
    - event: Transfer(address indexed from, address indexed to, uint256 amount)
    - event: Deposit(address indexed sender, address indexed owner, uint256 assets, uint256 shares)
    - event: Withdraw(address indexed sender, address indexed receiver, address indexed owner, uint256 assets,uint256 shares)
  - name: Router
    address:
    - 0x9B7E5b24f39d6AA30038Ee5a70Fc02574122Cb99
    handler: src/EventHandlers.ts
    events:
    - event: Deposit(address user, bool staked)
    - event: Withdraw(address user, bool unstaked, bool instant)

field_selection:
  transaction_fields:
    - transactionIndex
    - hash