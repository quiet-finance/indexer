type Wallet {
  id: ID!

  assetBalance: AssetBalanceSnapshot
  assetBalanceShanpshots: [AssetBalanceSnapshot!]! @derivedFrom(field: "wallet")

  shareBalance: ShareBalanceSnapshot
  shareBalanceShanpshots: [ShareBalanceSnapshot!]! @derivedFrom(field: "wallet")

  actions: [Action!]! @derivedFrom(field: "wallet")
  redeemRequests: [RedeemRequest!]! @derivedFrom(field: "recipient")
}

type Rebalance {
  id: ID!
  timestamp: Int! @index
  txHash: String!
  totalShares: BigDecimal! @config(precision: 78, scale: 18)
  stakedAssets: BigDecimal! @config(precision: 78, scale: 18)
  prevRebalance: Rebalance
}

type ShareBalanceSnapshot {
  id: ID!
  timestamp: Int! @index
  wallet: Wallet! @index
  amount: BigDecimal! @config(precision: 78, scale: 18)
  holdingStreak: Int!
}

type AssetBalanceSnapshot {
  id: ID!
  timestamp: Int! @index
  wallet: Wallet! @index
  amount: BigDecimal! @config(precision: 78, scale: 18)
  holdingStreak: Int!
}

enum ActionType {
      ISSUE
      REDEEM
      INSTANT_REDEEM
      STAKE
      UNSTAKE
}

type Action {
  id: ID!
  wallet: Wallet! @index
  actionType: ActionType!
  timestamp: Int!
  txHash: String!
  tokenIn: String!
  amountIn: BigDecimal! @config(precision: 78, scale: 18)
  tokenOut: String!
  amountOut: BigDecimal! @config(precision: 78, scale: 18)
}

type RedeemQueue {
  id: ID!
  redeemsCount: Int!
  claimedRedeemsCount: Int!
  redeemAssets: BigDecimal! @config(precision: 78, scale: 18)
  claimedRedeemAssets: BigDecimal! @config(precision: 78, scale: 18)
  processedRedeemsCount: Int!
}

type RedeemRequest {
  id: ID!
  requestedAt: Int!
  requestTxHash: String!
  redeemer: Wallet!
  recipient: Wallet! @index
  assetAmount: BigDecimal! @config(precision: 78, scale: 18)
  isClaimed: Boolean! @index
}

type Stats {
  id: ID!
  tvl: TvlSnapshot
  lastRebalance: Rebalance
}

type TvlSnapshot {
  id: ID!
  timestamp: Int! @index
  amount: BigDecimal! @config(precision: 78, scale: 18)
}