type Rebalance {
  id: ID!
  timestamp: Int @index
  startRebalanceTxHash: String!
  deployedUnderlyingBefore: BigInt!
  endRebalanceTxHash: String
  deployedUnderlyingAfter: BigInt
  totalShares: BigInt
  stakedAssets: BigInt
}

type ShareBalanceSnapshot {
  id: ID!
  timestamp: Int! @index
  address: String! @index
  amount: BigInt!
  holdingStreakSeconds: Int!
}

type ShareBalance {
  id: ID!
  updatedAt: Int!
  amount: BigInt!
  holdingStreakSeconds: Int!
}

type AssetBalanceSnapshot {
  id: ID!
  timestamp: Int! @index
  address: String! @index
  amount: BigInt!
  holdingStreakSeconds: Int!
}

type AssetBalance {
  id: ID!
  updatedAt: Int!
  amount: BigInt!
  holdingStreakSeconds: Int!
}

enum ActionType {
      ISSUE
      REDEEM
      INSTANT_REDEEM
      STAKE
      UNSTAKE
}

type Action {
  id: ID!
  address: String! @index
  actionType: ActionType!
  timestamp: Int!
  txHash: String!
  tokenIn: String!
  amountIn: BigInt!
  tokenOut: String!
  amountOut: BigInt!
}

type RedeemQueue {
  id: ID!
  redeemsCount: Int!
  claimedRedeemsCount: Int!
  redeemAssets: BigInt!
  claimedRedeemAssets: BigInt!
  processedRedeemsCount: Int!
}

type RedeemRequest {
  id: ID!
  requestedAt: Int!
  requestTxHash: String!
  redeemer: String!
  recipient: String! @index
  assetAmount: BigInt!
  isProcessed: Boolean! @index
}

type Stats {
  id: ID!
  tvl: BigInt!
}

type TvlSnapshotDaily {
  id: ID!
  timestamp: Int! @index
  amount: BigInt!
}